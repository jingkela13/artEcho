# 可选：用 GitHub Actions 部署。
# 使用方法：把本文件放到仓库的 .github/workflows/deploy.yml，
# 并在 Settings → Pages 里把 Source 选为 "GitHub Actions"。
# 如果你用的是「Deploy from a branch」方式，不需要这个文件。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
